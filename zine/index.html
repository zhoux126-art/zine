
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Memories With Songs</title>

    <style>
        /* =========================
           1. BASIC SETTINGS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* =========================
           2. SNOW BACKGROUND
        ========================= */

        #snow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .snowflake {
            position: absolute;
            top: -20px;
            color: white;
            opacity: 0.2;
            animation: snowfall linear infinite;
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-20px) translateX(0);
            }

            100% {
                transform: translateY(110vh) translateX(35px);
            }
        }


        /* =========================
           3. MAIN TITLE
        ========================= */

        header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 100px 20px 75px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 88px);
            font-weight: normal;
            line-height: 1.05;
            letter-spacing: -3px;
            text-transform: uppercase;
        }


        /* =========================
           4. ALBUM CAROUSEL
        ========================= */

        .album-section {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 30px 5% 100px;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .album-track {
            display: flex;
            gap: 28px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            padding: 25px 10px 35px;
            cursor: grab;
            scroll-snap-type: x mandatory;
            flex: 1;
            min-width: 0;
        }

        .album-track::-webkit-scrollbar {
            display: none;
        }

        .album-track.dragging {
            cursor: grabbing;
            scroll-behavior: auto;
            scroll-snap-type: none;
        }


        /* =========================
           5. ALBUM CARDS
        ========================= */

        .album {
            flex: 0 0 280px;
            scroll-snap-align: center;
            text-align: center;
            cursor: pointer;

            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px 12px 22px;

            background: rgba(255, 255, 255, 0.02);
            transition: all 0.35s ease;
        }

        .album:hover {
            transform: translateY(-8px) scale(1.025);
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
        }

        .album img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .album h2 {
            color: #ffffff;
            font-size: 17px;
            font-weight: normal;
            margin-top: 20px;
            line-height: 1.4;
        }


        /* =========================
           6. ARROW BUTTONS
        ========================= */

        .arrow {
            flex: 0 0 40px;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            background: transparent;
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .arrow:hover {
            background: white;
            color: black;
        }


        /* =========================
           7. LYRICS POPUP
        ========================= */

        .lyrics-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 10;

            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lyrics-overlay.active {
            display: flex;
        }

        .lyrics-box {
            position: relative;
            background: #101010;
            border: 1px solid rgba(255, 255, 255, 0.45);

            width: 100%;
            max-width: 650px;
            max-height: 80vh;
            overflow-y: auto;

            padding: 65px 45px;
            text-align: center;
        }

        .lyrics-box h2 {
            font-size: 30px;
            font-weight: normal;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .lyrics-box .artist {
            color: #999999;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .lyrics-box p {
            font-size: 16px;
            line-height: 2.1;
            white-space: pre-line;
            color: #dddddd;
            margin-top: 35px;
        }

        .close-button {
            position: absolute;
            top: 18px;
            right: 22px;

            border: none;
            background: none;
            font-size: 30px;
            cursor: pointer;
            color: white;
        }

        .close-button:hover {
            opacity: 0.6;
        }


        /* =========================
           8. MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 75px 15px 45px;
            }

            h1 {
                letter-spacing: -1px;
            }

            .album-section {
                padding: 20px 3% 70px;
            }

            .album {
                flex: 0 0 230px;
            }

            .carousel-container {
                gap: 6px;
            }

            .arrow {
                flex-basis: 32px;
                width: 32px;
                height: 32px;
                font-size: 18px;
            }

            .lyrics-box {
                padding: 60px 25px;
            }
        }

    </style>
</head>


<body>

    <!-- Lyrics popup -->

        /* =========================
           2. OPEN LYRICS
        ========================= */

        function openLyrics(index) {

            document.getElementById("lyricsTitle").textContent =
                songs[index].title;

            document.getElementById("lyricsArtist").textContent =
                songs[index].artist;

            document.getElementById("lyricsText").textContent =
                songs[index].lyrics;

            document.getElementById("lyricsOverlay").classList.add("active");
        }


        /* =========================
           3. CLOSE LYRICS
        ========================= */

        function closeLyrics() {

            document.getElementById("lyricsOverlay")
                .classList.remove("active");

        }


        // Close when clicking outside the popup
        function closeOutside(event) {

            if (event.target.id === "lyricsOverlay") {
                closeLyrics();
            }

        }


        // Close with ESC key
        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeLyrics();
            }

        });


        /* =========================
           4. CAROUSEL ARROWS
        ========================= */

        const track = document.getElementById("albumTrack");

        document.getElementById("next").addEventListener("click", function() {

            track.scrollBy({
                left: 308,
                behavior: "smooth"
            });

        });

        document.getElementById("prev").addEventListener("click", function() {

            track.scrollBy({
                left: -308,
                behavior: "smooth"
            });

        });


        /* =========================
           5. MOUSE DRAG
        ========================= */

        let isDragging = false;
        let startX = 0;
        let scrollStart = 0;

        track.addEventListener("pointerdown", function(event) {

            if (event.pointerType === "touch") return;

            isDragging = true;
            startX = event.clientX;
            scrollStart = track.scrollLeft;

            track.classList.add("dragging");
            track.setPointerCapture(event.pointerId);

        });

        track.addEventListener("pointermove", function(event) {

            if (!isDragging) return;

            const distance = event.clientX - startX;

            track.scrollLeft = scrollStart - distance;

        });

        function stopDragging() {

            isDragging = false;
            track.classList.remove("dragging");

        }

        track.addEventListener("pointerup", stopDragging);
        track.addEventListener("pointercancel", stopDragging);


        /* =========================
           6. CREATE SNOWFLAKES
        ========================= */

        const snow = document.getElementById("snow");

        for (let i = 0; i < 45; i++) {

            const flake = document.createElement("span");

            flake.className = "snowflake";
            flake.textContent = "✦";

            flake.style.left = Math.random() * 100 + "vw";

            flake.style.animationDuration =
                (10 + Math.random() * 15) + "s";

            flake.style.animationDelay =
                (Math.random() * 15) + "s";

            flake.style.fontSize =
                (5 + Math.random() * 7) + "px";

            flake.style.opacity =
                0.1 + Math.random() * 0.2;

            snow.appendChild(flake);

        }
